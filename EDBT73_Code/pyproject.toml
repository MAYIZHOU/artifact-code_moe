[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-market"
version = "0.1.0"
description = "Reproducible experiments for cost-aware MoE model markets"
requires-python = ">=3.8"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=17.0",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "xgboost>=2.1,<3",
  "catboost>=1.2,<2",
  "certifi>=2024.8",
  "torch>=2.4",
  "torchvision>=0.19",
  "ucimlrepo>=0.0.7",
  "unlzw3>=0.2.2,<0.2.3",
  "xlrd>=2.0.1,<3",
  "matplotlib>=3.7",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
